name: Node.js DevOps API CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environment in cloud agent
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install required runtime dependencies
      run: npm install

    - name: Execute automated unit and integration tests
      run: npm test
